# GitLab CI/CD Pipeline for Gravity TSETMC
# This file can be used if the project is hosted on GitLab

stages:
  - test
  - quality
  - security
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt

test:unit:
  stage: test
  image: python:3.10
  script:
    - pip install pytest pytest-cov pytest-mock
    - pytest tests/test_unit.py -v --cov=gravity_tse --cov=app --cov-report=term --cov-report=html
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
  coverage: '/TOTAL.*\s+(\d+%)$/'

test:integration:
  stage: test
  image: python:3.10
  script:
    - pip install pytest pytest-mock
    - pytest tests/test_integration.py -v --tb=short
  allow_failure: true

lint:
  stage: quality
  image: python:3.10
  script:
    - pip install flake8 pylint black isort
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - black --check . --diff
    - isort --check-only --diff .
  allow_failure: true

type_check:
  stage: quality
  image: python:3.10
  script:
    - pip install mypy
    - mypy gravity_tse app --ignore-missing-imports
  allow_failure: true

security:
  stage: security
  image: python:3.10
  script:
    - pip install bandit safety
    - bandit -r . -f txt
    - safety check || true
  allow_failure: true

pages:
  stage: deploy
  dependencies:
    - test:unit
  script:
    - mkdir -p public
    - cp -r htmlcov/* public/
  artifacts:
    paths:
      - public
  only:
    - develop
